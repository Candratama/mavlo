name: Cleanup demo users

on:
  schedule:
    - cron: '0 18 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger cleanup endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS -o /tmp/body -w "%{http_code}" -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            https://mavlo.web.id/api/cron/cleanup-demo)
          cat /tmp/body
          echo
          if [ "$response" != "200" ]; then
            echo "Cleanup failed with status $response"
            exit 1
          fi
